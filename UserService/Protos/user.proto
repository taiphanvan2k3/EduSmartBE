syntax = "proto3";
option csharp_namespace = "UserService.GrpcServices";
import "google/protobuf/wrappers.proto";

service User {
    rpc GetUserInfo (UserRequest) returns (UserResponse);
    rpc GetUserInfoWithRole (UserRequest) returns (UserWithRoleResponse);
    rpc CheckUserExist (UserRequest) returns (CheckUserExistResponse);
    rpc GetListOfUsers (UsersRequest) returns (ListOfUsersWithRoleResponse);
    rpc GetListOfTeachers (UsersRequest) returns (ListOfUsersResponse);
    rpc GetListOfStudents (UsersRequest) returns (ListOfUsersResponse);
    rpc GetTeachersByName(UserRequest) returns (ListOfUsersResponse);
    rpc DeleteUser(UserRequest) returns (MessageResponse);
}

// Dùng để lấy thông tin user theo id
message UserRequest {
    int32 id = 1;
    string name = 2;
}

// Dùng để lấy danh sách user theo mảng id
message UsersRequest {
    repeated int32 ids = 1; // Truyền vào mảng các id
}

message SimpleUserResponse {
    int32 id = 1;
    string userName = 2;
    string fullName = 3;
    google.protobuf.StringValue avatarURL = 4;
    google.protobuf.StringValue email = 5;
}

message UserResponse {
    int32 id = 1;
    string userName = 2;
    string firstName = 3;
    string lastName = 4;
    string email = 5;
}

message UserWithRoleResponse {
    int32 id = 1;
    string userName = 2;
    string firstName = 3;
    string lastName = 4;
    string email = 5;
    string avatarURL = 6;
    string roles = 7;
}

message ListOfUsersResponse {
    repeated SimpleUserResponse users = 1;
}

message ListOfUsersWithRoleResponse {
    repeated UserWithRoleResponse users = 1;
}

message CheckUserExistResponse {
    bool isExist = 1;
}

message MessageResponse {
    int32 statusCode = 1;
    string message = 2;
}