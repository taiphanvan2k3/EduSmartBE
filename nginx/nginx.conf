events { worker_connections 1024; }

http {
    # Hỗ trợ upload file dung lượng lớn (ví dụ video qua course-service)
    client_max_body_size 200M; 

    # Cấu hình map để tự động xử lý Connection/Upgrade Header cho WebSocket/SignalR
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream auth_service {
        server authservice:80;
    }

    upstream user_service {
        server userservice:80;
    }

    upstream course_service {
        server courseservice:80;
    }

    upstream payment_service {
        server paymentservice:80;
    }

    upstream media_service {
        server mediaservice:7154;
    }

    server {
        listen 80;

        # Cấu hình chung cho việc proxy
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Kích hoạt hỗ trợ WebSocket / SignalR Connection Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # -------------------------------------------------------------
        # BẢO VỆ SWAGGER UI CỦA CÁC SERVICE BẰNG HTTP BASIC AUTH
        # -------------------------------------------------------------
        
        location ~ ^/auth-service/swagger {
            auth_basic "Restricted area - Swagger Docs";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://auth_service;
        }

        location ~ ^/user-service/swagger {
            auth_basic "Restricted area - Swagger Docs";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://user_service;
        }

        location ~ ^/course-service/swagger {
            auth_basic "Restricted area - Swagger Docs";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://course_service;
        }

        location ~ ^/payment-service/swagger {
            auth_basic "Restricted area - Swagger Docs";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://payment_service;
        }

        location ~ ^/media-service/swagger {
            auth_basic "Restricted area - Swagger Docs";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://media_service;
        }

        # -------------------------------------------------------------
        # ĐIỀU HƯỚNG CÁC API VÀ ĐƯỜNG DẪN THƯỜNG (KHÔNG BẢO VỆ)
        # -------------------------------------------------------------

        # Điều hướng /auth-service về authservice
        location /auth-service {
            proxy_pass http://auth_service;
        }

        # Điều hướng /user-service về userservice
        location /user-service {
            proxy_pass http://user_service;
        }

        # Điều hướng /course-service về courseservice
        location /course-service {
            proxy_pass http://course_service;
        }

        # Điều hướng /payment-service về paymentservice
        location /payment-service {
            proxy_pass http://payment_service;
        }

        # Điều hướng /media-service về mediaservice
        location /media-service {
            proxy_pass http://media_service;
        }
    }
}
