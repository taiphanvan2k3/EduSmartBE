stages:
  - restore_and_build_dotnet_services
  - build_nodejs_services
  - deploy

restore_and_build_service:
  stage: restore_and_build_dotnet_services
  image: mcr.microsoft.com/dotnet/sdk:8.0
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .nuget/packages/
      - AuthService/obj/
      - UserService/obj/
      - CourseManagementService/obj/
      - PaymentService/obj/
  script:
    - dotnet restore edusmartbe.sln --packages .nuget/packages
    - ls -la .nuget/packages/  # List directory contents to verify packages have been restored
    - |
      services=("AuthService" "UserService" "CourseManagementService" "PaymentService")
      for service in "${services[@]}"; do
        if git diff --name-only HEAD HEAD~1 | grep -q "${service}/"; then
          echo "Building ${service}..."
          dotnet build ${service}/${service}.csproj --configuration Release --no-restore
        else
          echo "No changes in ${service}, skipping build."
        fi
      done
  rules:
    # Unnecessary to build projects when pushing to main branch and only running the pipeline for merge request events
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - 'AuthService/**/*'
        - 'UserService/**/*'
        - 'CourseManagementService/**/*'
        - 'PaymentService/**/*'

build_media_service:
  stage: build_nodejs_services
  image: node:18
  cache:
    key: ${CI_COMMIT_REF_SLUG}-npm
    paths:
      - MediaService/node_modules/
  script:
    - echo "Checking changes in MediaService..."
    - |
      if git diff --name-only HEAD HEAD~1 | grep -q "MediaService/"; then
        echo "Changes detected in MediaService, running build process..."
        cd MediaService
        npm install
        npm run build
      else
        echo "No changes in MediaService, skipping build."
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - 'MediaService/**/*'

deploy_services:
  stage: deploy
  environment: production
  before_script:
    - apt-get update && apt-get install -y openssh-client  # Cài đặt SSH client bằng apt-get
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 --decode > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $SSH_SERVER_IP >> ~/.ssh/known_hosts
  script:
    - echo "Pulling latest code from the repository"
    - ssh -i ~/.ssh/id_rsa $SSH_USER@$SSH_SERVER_IP "cd $PATH_TO_PROJECT && eval \"\$(ssh-agent -s)\" && ssh-add /root/.ssh/id_rsa_gitlab && git fetch --prune origin && git reset --hard origin/main && git clean -fd && git gc --prune=now && git pull origin main"
    - |
      services=("authservice" "userservice" "coursemanagementservice" "paymentservice" "mediaservice")
      for service in "${services[@]}"; do
        # Kiểm tra xem có thay đổi nào trong service đó hoặc trong docker-compose.yml hoặc .gitlab-ci.yml không
        if git diff --name-only HEAD HEAD~1 | grep -qiE "^${service}/|^docker-compose.yml|.gitlab-ci.yml"; then
          echo "Deploying ${service} to production server"
          ssh -i ~/.ssh/id_rsa $SSH_USER@$SSH_SERVER_IP "cd $PATH_TO_PROJECT && pwd && docker-compose build $service && docker-compose up -d --no-deps $service"
          echo "${service} deployed successfully"
        else
          echo "No changes detected for ${service}. Skipping deployment."
        fi
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - '.gitlab-ci.yml'
        - 'docker-compose.yml'
        - 'AuthService/**/*'
        - 'UserService/**/*'
        - 'CourseManagementService/**/*'
        - 'PaymentService/**/*'
        - 'MediaService/**/*'