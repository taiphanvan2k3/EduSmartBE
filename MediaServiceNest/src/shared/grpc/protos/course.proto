syntax = "proto3";

service Course {
    rpc CheckStudentCompletedCourse(CheckStudentCompletedCourseRequest) returns (CheckStudentCompletedCourseResponse);
}

message CheckStudentCompletedCourseRequest {
    int32 studentId = 1;
    string courseId = 2;
}

message CheckStudentCompletedCourseResponse {
    bool isCompleted = 1;
    string studentName = 2;
    string courseName = 3;
    string teacherName = 4;
    string message = 5;
    bool isSuccess = 6;
}
